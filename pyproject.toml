[build-system]
requires = ["setuptools>=67", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "humanoidmimicgen"
version = "0.1.0"
description = "Humanoid loco-manipulation environments built on RoboCasa."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "NVIDIA" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "mujoco>=3.3,<3.4",
    "numpy==1.26.4",
    "robosuite==1.5.2",
    "robosuite-models==1.0.0",
]

[project.optional-dependencies]
wbc-replay = [
    "datasets==3.6.0",
    "gymnasium==0.29.1",
    "lerobot==0.1.0",
    "loguru",
    "onnxruntime==1.22.1",
    "opencv-python==4.11.0.86",
    "pin>=2.7,<3",
    "PyYAML==6.0.3",
    "scipy==1.15.3",
    "torch>=2.2.1,<2.7",
    "tqdm==4.67.1",
]
visualization = [
    "matplotlib",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["robocasa*", "humanoidmimicgen*"]

[tool.setuptools.package-data]
"robocasa.models" = ["assets/**/*"]
"humanoidmimicgen" = ["configs/wbc/*.yaml"]
"humanoidmimicgen.wbc" = [
    "**/*.json",
    "**/*.md",
    "**/*.onnx",
    "**/*.STL",
    "**/*.stl",
    "**/*.urdf",
    "**/*.xml",
    "**/*.yaml",
]
