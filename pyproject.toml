[build-system]
requires = ["setuptools>=67", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "humanoidmimicgen"
version = "0.1.0"
description = "Humanoid loco-manipulation environments built on RoboCasa."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "NVIDIA" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "h5py>=3.10",
    "mujoco>=3.3,<3.4",
    "numpy==1.26.4",
    "robosuite==1.5.2",
    "robosuite-models==1.0.0",
]

[project.optional-dependencies]
video = [
    "imageio[ffmpeg]",
]
visualization = [
    "matplotlib",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["robocasa*", "humanoidmimicgen*"]

[tool.setuptools.package-data]
"robocasa.models" = ["assets/**/*"]
"humanoidmimicgen" = ["configs/wbc/*.yaml"]
